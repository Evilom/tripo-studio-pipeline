name: Extension and delivery checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Extension tests with mock Chrome API and DOM
        run: node --test extension/tests/*.test.cjs
      - name: Delivery and animated GLB checks
        run: python -m unittest discover -s tests -v
