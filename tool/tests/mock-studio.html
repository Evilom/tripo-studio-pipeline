<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <title>Mock Tripo Studio</title>
  </head>
  <body>
    <h1>生成模型</h1>
    <button id="single-view" type="button"><span class="i-tripo:add-image"></span></button>
    <button id="multi-view" type="button"><span class="i-tripo:multi-view"></span></button>
    <main id="workspace"></main>
    <button id="generate" type="button" disabled>Generate 55</button>
    <p id="submission" data-testid="submission" hidden>Submitted</p>
    <p id="processing" hidden></p>
    <button id="hd-mode" type="button" aria-pressed="false">HD Model</button>
    <button id="retopo-nav" type="button" hidden>Retopo</button>
    <section id="retopo-panel" hidden>
      <button id="quad" type="button" aria-pressed="true" data-state="on">Quad</button>
      <button id="triangle" type="button" aria-pressed="false" data-state="off">Triangle</button>
      <button id="smart" type="button" role="switch" aria-checked="false">Smart Low Poly v2</button>
      <input id="polygon-count" type="number" value="5000">
      <button id="retopology" type="button">Retopology 35</button>
    </section>
    <button id="texture-nav" type="button">Texture</button>
    <section id="texture-panel" hidden>
      <button id="texture-2k" type="button" aria-pressed="false" data-state="off">2K</button>
      <button id="texture-4k" type="button" aria-pressed="false" data-state="off">4K</button>
      <button id="texture-8k" type="button" aria-pressed="true" data-state="on">8K</button>
      <button id="texture" type="button" disabled>Generate Texture 30</button>
    </section>
    <button id="export" type="button" hidden>Export</button>

    <script>
      const slots = ["front", "left", "right", "back"];
      const workspace = document.querySelector("#workspace");
      const generate = document.querySelector("#generate");
      const submission = document.querySelector("#submission");
      const processing = document.querySelector("#processing");

      function updateGenerate() {
        const inputs = [...workspace.querySelectorAll('input[type="file"]')];
        generate.disabled = inputs.length !== 4 || inputs.filter((input) => input.files.length === 1).length < 3 || inputs[0].files.length !== 1;
      }

      function renderMultiView() {
        workspace.replaceChildren();
        for (const slot of slots) {
          const label = document.createElement("label");
          label.textContent = slot;
          const input = document.createElement("input");
          input.type = "file";
          input.accept = "image/png,image/webp,image/jpg,image/jpeg";
          input.dataset.slot = slot;
          input.addEventListener("change", updateGenerate);
          label.append(input);
          workspace.append(label);
        }
        updateGenerate();
      }

      setTimeout(() => {
        document.querySelector("#multi-view").addEventListener("click", renderMultiView);
      }, 300);
      generate.addEventListener("click", () => {
        submission.hidden = false;
        submission.textContent = `Submitted ${[...workspace.querySelectorAll("input")].map((input) => input.files[0]?.name).filter(Boolean).join(",")}`;
        processing.hidden = false;
        processing.textContent = "Generating";
        generate.disabled = true;
        setTimeout(() => {
          submission.hidden = true;
          processing.hidden = true;
          document.querySelector("#retopo-nav").hidden = false;
        }, 150);
      });

      document.querySelector("#hd-mode").addEventListener("click", (event) => event.currentTarget.setAttribute("aria-pressed", "true"));
      document.querySelector("#retopo-nav").addEventListener("click", () => document.querySelector("#retopo-panel").hidden = false);
      for (const topology of ["quad", "triangle"]) {
        document.querySelector(`#${topology}`).addEventListener("click", (event) => {
          for (const option of [document.querySelector("#quad"), document.querySelector("#triangle")]) {
            option.setAttribute("aria-pressed", "false");
            option.dataset.state = "off";
          }
          event.currentTarget.setAttribute("aria-pressed", "true");
          event.currentTarget.dataset.state = "on";
        });
      }
      document.querySelector("#smart").addEventListener("click", (event) => event.currentTarget.setAttribute("aria-checked", "true"));
      document.querySelector("#retopology").addEventListener("click", (event) => {
        const button = event.currentTarget;
        button.disabled = true;
        processing.hidden = false;
        processing.textContent = "重拓扑中";
        setTimeout(() => {
          processing.hidden = true;
          button.disabled = false;
          document.querySelector("#texture").disabled = false;
          document.querySelector("#texture-nav").hidden = false;
        }, 1250);
      });
      document.querySelector("#texture-nav").addEventListener("click", () => document.querySelector("#texture-panel").hidden = false);
      for (const resolution of ["2k", "4k", "8k"]) {
        document.querySelector(`#texture-${resolution}`).addEventListener("click", (event) => {
          for (const option of document.querySelectorAll('[id^="texture-"]')) {
            if (!/texture-(2k|4k|8k)/.test(option.id)) continue;
            option.setAttribute("aria-pressed", "false");
            option.dataset.state = "off";
            delete option.dataset.selected;
          }
          event.currentTarget.setAttribute("aria-pressed", "true");
          event.currentTarget.dataset.state = "on";
          event.currentTarget.dataset.selected = "true";
        });
      }
      document.querySelector("#texture").addEventListener("click", (event) => {
        const button = event.currentTarget;
        button.disabled = true;
        processing.hidden = false;
        processing.textContent = "Generating Texture";
        setTimeout(() => {
          processing.hidden = true;
          button.disabled = false;
          document.querySelector("#export").hidden = false;
        }, 150);
      });
    </script>
  </body>
</html>
